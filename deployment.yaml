apiVersion: apps/v1
kind: Deployment
metadata:
  name: symfony-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: symfony-app
  template:
    metadata:
      labels:
        app: symfony-app
    spec:
      containers:
      - name: symfony-app
        image: ghcr.io/sokyutukumo/symfony-app:027ba52
        ports:
        - containerPort: 80
